services:
  # Backend: Spring Boot Web Service
  - type: web
    name: luxethreads-backend
    env: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080

  # Frontend: Vite Static Site
  - type: static
    name: luxethreads-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: luxethreads-backend
          type: web
          property: host
