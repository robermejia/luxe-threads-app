services:
  # Backend: Spring Boot Web Service
  - type: web
    name: luxethreads-backend
    env: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080

  # Frontend: Vite Static Site
  - type: web
    name: luxethreads-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: luxethreads-backend
          type: web
          property: host
